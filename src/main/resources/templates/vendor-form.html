<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${vendorId == null} ? 'New vendor' : 'Edit vendor')}"></head>
<body>
<nav th:replace="~{layout :: sidebar('vendors')}"></nav>
<div id="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${vendorId == null} ? 'New vendor' : 'Edit vendor #' + ${vendorId}">Vendor</h1>
            <p class="page-subtitle">Vendors start PENDING; risk evaluation moves them to ACTIVE or HIGH_RISK.</p>
        </div>
    </div>
    <div class="page-body">
        <div class="card narrow">
            <form th:action="${vendorId == null} ? @{/vendors} : @{/vendors/{id}(id=${vendorId})}" method="post" th:object="${form}">
                <div class="form-field">
                    <label for="name">Vendor name</label>
                    <input id="name" type="text" th:field="*{name}" maxlength="150" required/>
                    <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</div>
                </div>
                <div class="form-field">
                    <label for="contact">Contact email</label>
                    <input id="contact" type="text" th:field="*{contact}" maxlength="200" placeholder="orders@vendor.com"/>
                    <div class="form-error" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}">error</div>
                </div>
                <div class="form-field">
                    <label for="rating">Rating (0 to 5)</label>
                    <input id="rating" type="number" step="0.1" min="0" max="5" th:field="*{rating}" required/>
                    <div class="form-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">error</div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/vendors}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="${vendorId == null} ? 'Create vendor' : 'Save changes'">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
