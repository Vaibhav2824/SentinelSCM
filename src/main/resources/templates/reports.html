<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Reports')}"></head>
<body>
<nav th:replace="~{layout :: sidebar('reports')}"></nav>
<div id="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Reports</h1>
            <p class="page-subtitle" th:text="'Generated ' + ${#temporals.format(performance.generatedAt, 'dd MMM yyyy HH:mm')}">Generated</p>
        </div>
        <div class="actions">
            <a th:href="@{/api/report/performance.csv}" class="btn btn-ghost"><span class="material-symbols-outlined" style="font-size:18px">download</span> Performance CSV</a>
            <a th:if="${isAdmin}" th:href="@{/api/report/strategic.csv}" class="btn btn-primary"><span class="material-symbols-outlined" style="font-size:18px">download</span> Strategic CSV</a>
        </div>
    </div>
    <div class="page-body" id="reportTabs">
        <div class="tabs">
            <button class="tab active" data-tab="performance">Performance</button>
            <button class="tab" data-tab="strategic" th:if="${isAdmin}">Strategic</button>
        </div>

        <div class="tab-panel" data-panel="performance">
            <div class="kpi-grid">
                <div class="kpi-card" th:each="s : ${performance.statistics}">
                    <div class="kpi-label" th:text="${s.key}">stat</div>
                    <div class="kpi-value primary" th:text="${s.value}">0</div>
                </div>
            </div>
            <div class="card" style="padding:0">
                <div class="table-wrap" style="border:none">
                    <table>
                        <thead><tr><th>Vendor</th><th>Status</th><th class="num">Rating</th><th class="num">Risk</th><th>Level</th><th class="num">Timeliness</th><th class="num">Defects</th><th class="num">Compliance</th></tr></thead>
                        <tbody>
                        <tr th:each="v : ${performance.vendors}">
                            <td style="font-weight:600" th:text="${v['name']}">Vendor</td>
                            <td><span th:replace="~{layout :: statusBadge(${v['status']})}"></span></td>
                            <td class="num" th:text="${v['rating']}">4.5</td>
                            <td class="num mono" th:text="${v['riskScore']}">0.12</td>
                            <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(v['riskLevel'])}" th:text="${v['riskLevel']}">LOW</span></td>
                            <td class="num" th:text="${v['deliveryTimeliness']} ?: '—'">0.9</td>
                            <td class="num" th:text="${v['defectRate']} ?: '—'">0.05</td>
                            <td class="num" th:text="${v['complianceScore']} ?: '—'">0.95</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-panel" data-panel="strategic" hidden th:if="${isAdmin}">
            <div class="kpi-grid">
                <div class="kpi-card" th:each="s : ${strategic.statistics}" th:if="${s.key != 'top5HighRisk'}">
                    <div class="kpi-label" th:text="${s.key}">stat</div>
                    <div class="kpi-value" th:classappend="${s.key == 'highRiskCount' or s.key == 'unresolvedAlerts'} ? 'danger' : 'primary'" th:text="${s.value}">0</div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Top 5 highest-risk vendors</div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Vendor</th><th class="num">Risk score</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="t : ${strategic.statistics['top5HighRisk']}">
                            <td style="font-weight:600" th:text="${t['name']}">Vendor</td>
                            <td class="num mono" th:text="${#numbers.formatDecimal(t['riskScore'], 1, 3)}">0.850</td>
                            <td><span th:replace="~{layout :: statusBadge(${t['status']})}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>bindTabs('reportTabs');</script>
</body>
</html>
