<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign in')}"></head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo"><span class="material-symbols-outlined">hub</span></div>
            <div>
                <div class="login-title">SentinelSCM</div>
                <div class="text-muted">Supply chain risk command centre</div>
            </div>
        </div>

        <div class="flash error" th:if="${param.error}">
            <span class="material-symbols-outlined" style="color:var(--error);font-size:18px">error</span>
            Invalid email or password.
        </div>
        <div class="flash success" th:if="${param.logout}">
            <span class="material-symbols-outlined" style="color:var(--success);font-size:18px">check_circle</span>
            You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="username">Email</label>
                <input id="username" name="username" type="email" autocomplete="username" required autofocus/>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                <span class="material-symbols-outlined" style="font-size:18px">login</span> Sign in
            </button>
        </form>

        <div class="demo-creds" th:if="${showDemoCredentials}">
            <div class="card-title">Demo accounts</div>
            <table>
                <tr th:each="acct : ${demoAccounts}">
                    <td th:text="${acct.role}">Role</td>
                    <td><button type="button" th:attr="onclick=|fillLogin('${acct.email}','${acct.password}')|" th:text="${acct.email}">email</button></td>
                </tr>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
