# Local / demo stack: MySQL 8.4 + SentinelSCM built from source.
#   cp .env.example .env   (edit passwords)
#   docker compose up --build
services:
  mysql:
    image: mysql:8.4
    container_name: sentinelscm-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scm_db}
      MYSQL_USER: ${MYSQL_USER:-scm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    image: ghcr.io/vaibhav2824/sentinelscm:local
    container_name: sentinelscm-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scm_db}
      MYSQL_USER: ${MYSQL_USER:-scm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SENTINEL_RISK_STRATEGY: ${SENTINEL_RISK_STRATEGY:-weighted}
      SENTINEL_DEMO_SHOW_CREDENTIALS: ${SENTINEL_DEMO_SHOW_CREDENTIALS:-true}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
